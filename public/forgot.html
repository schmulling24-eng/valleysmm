<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password – Valley SMM</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
  .auth-wrap{width:100%;max-width:420px}
  .auth-logo{text-align:center;margin-bottom:2rem;font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--white)}
  .auth-logo span{color:var(--green)}
  .auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem}
  .auth-card h2{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--white);margin-bottom:.3rem}
  .auth-card p{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
  .auth-footer{text-align:center;margin-top:1.2rem;font-size:.85rem;color:var(--muted)}
  .auth-footer a{color:var(--green);font-weight:600}
</style></head><body>
<div class="auth-wrap">
  <div class="auth-logo">Valley<span>SMM</span></div>
  <div class="auth-card">
    <h2>Reset Password</h2>
    <p>Enter your email and we'll send you a reset link.</p>
    <div id="formView">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="resetEmail" placeholder="you@example.com">
      </div>
      <button class="btn btn-primary btn-full" id="resetBtn" onclick="sendReset()">Send Reset Link</button>
    </div>
    <div id="successView" style="display:none" class="alert alert-success">
      ✅ If that email exists, a reset link has been sent. Check your inbox.
    </div>
    <div class="auth-footer"><a href="/login.html">← Back to Login</a></div>
  </div>
</div>
<script src="/shared.js"></script>
<script>
async function sendReset(){
  const email=document.getElementById('resetEmail').value.trim();
  if(!email){toast('Enter your email','error');return;}
  const btn=document.getElementById('resetBtn');btn.disabled=true;btn.textContent='Sending...';
  try{
    await apiFetch('/auth/forgot-password',{method:'POST',body:JSON.stringify({email})});
    document.getElementById('formView').style.display='none';
    document.getElementById('successView').style.display='block';
  }catch(e){
    // Always show success to avoid email enumeration
    document.getElementById('formView').style.display='none';
    document.getElementById('successView').style.display='block';
  }
}
</script>
</body></html>
