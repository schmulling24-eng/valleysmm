<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password – Valley SMM</title>
<link rel="stylesheet" href="/styles.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.auth-wrap{width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:2rem;font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--white)}
.auth-logo span{color:var(--green)}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem}
.auth-card h2{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--white);margin-bottom:.3rem}
.auth-card p{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
</style></head><body>
<div class="auth-wrap">
  <div class="auth-logo">Valley<span>SMM</span></div>
  <div class="auth-card">
    <h2>Set New Password</h2>
    <p>Enter your new password below.</p>
    <div id="formView">
      <div class="form-group"><label class="form-label">New Password</label><input type="password" class="form-control" id="newPw" placeholder="Min 6 characters" minlength="6"></div>
      <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" class="form-control" id="confirmPw" placeholder="Repeat new password"></div>
      <button class="btn btn-primary btn-full mt-2" id="resetBtn" onclick="doReset()">Set New Password</button>
    </div>
    <div id="successView" style="display:none" class="alert alert-success mt-2">✅ Password reset! <a href="/login.html" style="color:var(--green);font-weight:700">Login now →</a></div>
    <div id="errorView" style="display:none" class="alert alert-warning mt-2">⚠️ This reset link is invalid or has expired. <a href="/forgot.html" style="color:var(--green)">Request a new one</a>.</div>
  </div>
</div>
<script src="/shared.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
if(!token){ document.getElementById('formView').style.display='none'; document.getElementById('errorView').style.display='block'; }

async function doReset(){
  const pw=document.getElementById('newPw').value;
  const conf=document.getElementById('confirmPw').value;
  if(!pw||pw.length<6){toast('Min 6 characters','error');return;}
  if(pw!==conf){toast('Passwords do not match','error');return;}
  const btn=document.getElementById('resetBtn');btn.disabled=true;btn.textContent='Resetting...';
  try{
    await apiFetch('/auth/reset-password',{method:'POST',body:JSON.stringify({token,newPassword:pw})});
    document.getElementById('formView').style.display='none';
    document.getElementById('successView').style.display='block';
  }catch(e){
    document.getElementById('formView').style.display='none';
    document.getElementById('errorView').style.display='block';
  }
}
</script>
</body></html>
