<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – Valley SMM</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--dark);padding:1rem}
  .auth-wrap{width:100%;max-width:420px}
  .auth-logo{text-align:center;margin-bottom:2rem;font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--white)}
  .auth-logo span{color:var(--green)}
  .auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem}
  .auth-card h2{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--white);margin-bottom:.3rem}
  .auth-card p{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
  .auth-footer{text-align:center;margin-top:1.2rem;font-size:.85rem;color:var(--muted)}
  .auth-footer a{color:var(--green);font-weight:600}
  .divider{text-align:center;color:var(--muted);font-size:.8rem;margin:1rem 0;position:relative}
  .divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
  .divider::before{left:0}.divider::after{right:0}
</style></head><body>
<div class="auth-wrap">
  <div class="auth-logo">Valley<span>SMM</span></div>
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p>Sign in to your account to continue</p>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between">
          Password <a href="/forgot.html" style="color:var(--green);font-weight:500;font-size:.8rem">Forgot password?</a>
        </label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-2" id="loginBtn">Sign In</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="/register.html">Create one free</a></div>
  </div>
  <div style="text-align:center;margin-top:1.5rem;color:var(--muted);font-size:.78rem">
    🇰🇪 Kenya's #1 SMM Panel · M-Pesa Accepted
  </div>
</div>
<script src="/shared.js"></script>
<script>
  if(getToken()) window.location.href='/dashboard.html';
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      const data = await apiFetch('/auth/login', {
        method:'POST', body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      setAuth(data.token, data.user);
      toast('Welcome back, ' + data.user.name + '!');
      setTimeout(() => window.location.href = data.user.role==='admin' ? '/admin.html' : '/dashboard.html', 500);
    } catch(e) { toast(e.message,'error'); btn.disabled=false; btn.textContent='Sign In'; }
  });
</script>
</body></html>
